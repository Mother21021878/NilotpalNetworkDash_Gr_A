                                            .some(v =>
                                                v.toLowerCase().includes(value.toLowerCase())
                                            )
                                        );

                                        if (match)
                                            expandParents(match.endpointId);
                                    }}
                                    style={{
                                        width: "460px",
                                        padding: "8px 12px",
                                        border: "2px solid #556B2F",
                                        borderRadius: "6px",
                                        fontSize: "14px",
                                        outline: "none"
                                    }}
                                />

                                {
                                    topologySearch &&
                                    <button
                                        className="btn"
                                        onClick={() => setTopologySearch("")}
                                    >

                                    </button>
                                }

                                    display: "grid",
                                    gridTemplateColumns: "repeat(4, auto)",
                                    gap: "10px 30px",
                                    marginTop: "8px",
                                    fontSize: "13px",
                                    fontWeight: "600",
                                    color: "#444"
                                }}

                                <div>🌐 Gateway : {topology?.summary?.gatewayCount ?? 0}</div>

                                <div>🖧 Switches : {topology?.summary?.switchCount ?? 0}</div>

                                </div>

                                <div style={{ color: "#C62828" }}>
                                    🔴 Offline : {stats.offline}
                                </div>

                                <div>
                                    🔌 Wired : {stats.wired}
                                </div>

                                <div>
                                    📶 Wireless : {stats.wireless}
                                </div>

                                <div style={{ color: "#C62828" }}>
                                    🔴 Critical : {stats.critical}
                                </div>

                                <div style={{ color: "#EF6C00" }}>
                                    🟠 High : {stats.high}
                                </div>

                                <div style={{ color: "#F9A825" }}>
                                    🟡 Medium : {stats.medium}
                                </div>

                                <div style={{ color: "#2E7D32" }}>
                                    🟢 Low : {stats.low}
                                </div>

                            </div>

                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        <TopologyLegend />
                        {
                            selectedPath.length > 0 &&

                            <div
                                style={{
                                    marginBottom: "20px",
                                    padding: "12px",
                                    border: "1px solid #556B2F",
                                    borderRadius: "8px",
                                    background: "#F7FAF1",
                                    fontWeight: "600",
                                    color: "#2E7D32",
                                    fontSize: "15px"
                                }}
                            >

                                <span>📍 Selected Path :</span>

                                {
                                    selectedPath.map((device, index) => (

                                        <React.Fragment key={device.endpointId || index}>

                                            {index > 0 && "  →  "}

                                            {device.hostname || device.ip || "Gateway"}

                                        </React.Fragment>

                                    ))
                                }

                            </div>
                        }
                        {
                            loading ? (

                                <div style={styles.centerMessage}>
                                    Building Network Topology...
                                </div>

                            ) : (

                                <div
                                    style={{
                                        transform: `scale(${zoom})`,
                                        transformOrigin: "top center",
                                        transition: "transform 0.25s ease"
                                    }}
                                >

                                    <div style={treeStyles.level}>

                                        <NetworkNode

                                            icon="🌐"

                                            title={
                                                topology?.gateway?.hostname ||
                                                topology?.gateway?.ip ||
                                                "Gateway"
                                            }

                                            subtitle={topology?.gateway?.ip}

                                            manufacturer={topology?.gateway?.manufacturer}

                                            deviceType={topology?.gateway?.deviceType}
                                            macAddress={topology?.gateway?.mac}
                                            vendor={topology?.gateway?.manufacturer}

                                            connectionType="Gateway"

                                            riskLevel={topology?.gateway?.deviceRiskLevel}
                                            riskScore={topology?.gateway?.deviceRiskScore}
                                            riskReason={
                                                topology?.gateway?.deviceRiskReasons?.[0]?.text ||
                                                topology?.gateway?.deviceRiskReasons?.[0] ||
                                                "-"
                                            }

                                            status={topology?.gateway?.active}
                                            parentName="-"
                                            childCount={gatewayChildren.length}
                                            topologyLevel="Root"
                                            linkConfidence="100%"
                                            highlight={
                                                selectedEndpoint !== null ||

                                                (
                                                    topologySearch &&
                                                    (
                                                        topology?.gateway?.hostname ||
                                                        topology?.gateway?.ip ||
                                                        ""
                                                    )
                                                    .toLowerCase()
                                                    .includes(topologySearch.toLowerCase())
                                                )
                                            }
                                            onContextMenu={(event) =>
                                                openContextMenu(event, topology?.gateway)
                                            }
                                            onClick={() => {
                                                setSelectedEndpoint(topology?.gateway?.endpointId);
                                                onNodeClick(topology?.gateway);
                                            }}

                                        />
                                         {
                                        gatewayChildren.length > 0 && (

                                            <button
                                                style={treeStyles.collapseButton}
                                                onClick={(e) => {

                                                    e.stopPropagation();

                                                    toggleNode(topology.gateway.endpointId);

                                                }}
                                            >

                                                {
                                                    collapsedNodes[topology.gateway.endpointId]
                                                        ? `+${gatewayChildren.length}`
                                                        : "−"
                                                }

                                            </button>

                                        )
                                    }   
                                    </div>

                                    <div
                                        style={{
                                            display: "flex",
                                            justifyContent: "space-between",
                                            alignItems: "flex-start",
                                            marginTop: "30px"
                                        }}
                                    >

                                        {
                                            !collapsedNodes[topology?.gateway?.endpointId] &&
                                            renderChildDevices(topology?.gateway?.endpointId)
                                        }
                                    </div>

                                </div>
                            )
                        }
                        {
                            contextMenu.visible && (

                                <div
                                    style={{
                                        position: "fixed",
                                        left: contextMenu.x,
                                        top: contextMenu.y,
                                        background: "#FFFFFF",
                                        border: "1px solid #CCCCCC",
                                        borderRadius: "8px",
                                        boxShadow: "0 4px 12px rgba(0,0,0,0.25)",
                                        minWidth: "260px",
                                        zIndex: 99999,
                                        overflow: "hidden"
                                    }}
                                    onClick={(e) => e.stopPropagation()}
                                >

                                    <div
                                        style={{
                                            padding: "10px",
                                            fontWeight: "700",
                                            background: "#556B2F",
                                            color: "#FFFFFF"
                                        }}
                                    >
                                        {contextMenu.device?.hostname ||
                                        contextMenu.device?.ip ||
                                        "Device"}
                                    </div>

                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() => {
                                            setSelectedDevice(contextMenu.device);
                                            closeContextMenu();
                                        }}
                                    >
                                        📋 Device Details
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.ip)
                                        }
                                    >
                                        📄 Copy IP Address
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.mac)
                                        }
                                    >
                                        📄 Copy MAC Address
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.hostname)
                                        }
                                    >
                                        📄 Copy Hostname
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.endpointId)
                                        }
                                    >
                                        📄 Copy Endpoint ID
                                    </div>
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            copyToClipboard(contextMenu.device?.manufacturer)
                                        }
                                    >
                                        📄 Copy Manufacturer
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            openDeviceWeb(contextMenu.device)
                                        }
                                    >
                                        🌐 Open Web Interface
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            openTrafficAnalysis(
                                                contextMenu.device
                                            )
                                        }
                                    >
                                        📊 Traffic Analysis
                                    </div>
                                    <hr
                                        style={{
                                            margin: 0,
                                            border: "none",
                                            borderTop: "1px solid #DDDDDD"
                                        }}
                                    />
                                    <div
                                        style={styles.contextMenuItem}
                                        onClick={() =>
                                            openSecurityAnalysis(
                                                contextMenu.device
                                            )
                                        }
                                    >
                                        🛡️ Security Analysis
                                    </div>
                                </div>

                            )
                        }
                        <div style={styles.modalFooter}>

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        });

            deviceAILoading,
            deviceAIError,

            onClose

        }) {

            }

                    onAnalyzeDevice(null);
                }

                onClose();

                                                    }

                                                </span>

                                                    : device.deviceRiskScore >= 60 ? "5px solid #EF6C00"

                                        <ul style={{ margin:"0", paddingLeft:"18px" }}>{device.deviceRiskReasons.map((reason,index)=>

                    if (!response.ok)
                        throw new Error("Unable to load packets");

                    const data = await response.json();
                    const packetList = Array.isArray(data.packets)
                        ? data.packets
                        : [];

                    setPackets(previous => {
                        if (previous.length === packetList.length) {
                            const unchanged = previous.every((packet, index) =>
                                packet.id === packetList[index]?.id
                            );

                            if (unchanged)
                                return previous;
                        }
                        return packetList;
                    });
                    setTimeout(() => {
                        if (packetTableRef.current) {

                                packetTableRef.current.scrollHeight;
                        }
                    }, CONFIG.AUTO_SCROLL_DELAY);
                } catch (err) {
                    console.error(err);
                }

            const analyzePacket = React.useCallback(async (packet) => {

                if (!packet)

                const url = CONFIG.API_BASE + "/ai/analyze_packet";

                        CONFIG.API_BASE + "/ai/analyze_packet",

                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(packet)
                        }
                    );

                    if (!response.ok)
                        throw new Error(
                            "Unable to analyze packet."

                    const data = await response.json();

                    setPacketAIResult(data.analysis);

                    setPackets(previous =>
                        previous.map(p => {

                            return {
                                ...p,
                                riskScore: data.analysis.riskScore,

                                suspicious: data.analysis.suspicious
                            };

                    // Refresh Live Packet Table

                    const updatedPacket = data.packetNumber
                        ? packets.find(p => p.id === data.packetNumber)
                        : null;

                        setSelectedPacket(updatedPacket);
                        setSelectedWSPacket(updatedPacket);

            const HorizontalBarChart = React.memo(function HorizontalBarChart({

                data

                const chartData = Array.isArray(data)

                if (chartData.length === 0) {

                            No data available

                const maxValue = Math.max(
                    ...chartData.map(item => Number(item?.count || 0)),

                return (

            const filteredDevices = React.useMemo(() => {

                if (!search) return devices;

                    return [device.endpointId, device.hostname, device.ip, device.mac, device.manufacturer, device.model, device.operatingSystem,
                    device.httpServer, device.httpProduct, device.httpTitle, device.httpScheme, device.httpStatus,

                )].sort();

                        String(packet.protocol || "")
                            .trim()

                        String(transportFilter || "")
                            .trim()
                            .toUpperCase();

                    const selectedProtocol =
                        String(protocolFilter || "")
                            .trim()
                            .toUpperCase();

                    if (selectedTransport && transport !== selectedTransport
                    )
                        return false;
                    if (selectedProtocol && protocol !== selectedProtocol
                    )
                        return false;
                    if (!search)
                        return true;
                    return (
                        (packet.source || "").toLowerCase().includes(search) ||
                        (packet.destination || "").toLowerCase().includes(search) ||
                        (packet.protocol || "").toLowerCase().includes(search) ||
                        (packet.transport || "").toLowerCase().includes(search) ||
                        (packet.interface || "").toLowerCase().includes(search) ||

                    );
                });

            }, [packets, packetSearch, transportFilter, protocolFilter]);

            const filteredPacketCount = React.useMemo(

                () => filteredPackets.length,

            const packetSummary = React.useMemo(() => {

                const summary = {
                    total: 0,
                    counts: {}
                };

                packets.forEach(packet => {

                    const transport = (packet.transport || "UNKNOWN").toUpperCase();
                    const protocol = (packet.protocol || "OTHER").toUpperCase();

                    // No Transport Selected
                    if (transportFilter === "") {
                        summary.total++;
                        if (transport === "TCP") {
                            summary.counts.TCP =
                                (summary.counts.TCP || 0) + 1;
                        }
                        else if (transport === "UDP") {
                            summary.counts.UDP =
                                (summary.counts.UDP || 0) + 1;
                        }
                        else {
                            summary.counts.UNKNOWN =
                                (summary.counts.UNKNOWN || 0) + 1;
                        }
                        return;
                    }

                    // TCP
                    if (transportFilter === "TCP") {
                        if (transport !== "TCP")
                            return;
                        summary.total++;
                        summary.counts[protocol] =
                            (summary.counts[protocol] || 0) + 1;
                        return;
                    }

                    // UDP
                    if (transportFilter === "UDP") {
                        if (transport !== "UDP")
                            return;
                        summary.total++;
                        summary.counts[protocol] =
                            (summary.counts[protocol] || 0) + 1;
                        return;
                    }

                    // UNKNOWN
                    if (transportFilter === "UNKNOWN") {
                        if (
                            transport === "TCP" ||
                            transport === "UDP"
                        )
                            return;
                        summary.total++;
                        summary.counts[protocol] =

                        return response.json();

                            if (previous.length === newDevices.length) {

                                    device.ip === newDevices[index]?.ip &&

                        if (!response.ok)
                            throw new Error("Scan failed");
                        return response.json();
                    })

                    .then(data => {
                        const newDevices = Array.isArray(data.devices)
                            ? data.devices
                            : [];

                        setDevices(previous => {
                            if (previous.length === newDevices.length) {
                                const unchanged = previous.every((device, index) =>
                                    device.ip === newDevices[index]?.ip &&
                                    device.mac === newDevices[index]?.mac &&
                                    device.active === newDevices[index]?.active
                                );

                                if (unchanged)
                                    return previous;
                            }
                            return newDevices;
                        });
                        setDashboard(previous => ({
                            ...previous,
                            ...(data.dashboard || {})
                        }));

                        if (data.scanTime) {
                            setLastScanTime(data.scanTime);
                            localStorage.setItem(
                                "lastScanTime",
                                data.scanTime
                            );
                        }
                    })

                    .catch(error => {
                        console.error(error);
                        setError("Unable to complete network scan.");
                    })

                    .finally(() => {
                        scanningRef.current = false;
                        setScanning(false);
                    });
            }, [
                scanning,
                refreshing
            ]);

            const loadStatistics = React.useCallback(async () => {

                try {

                    const response = await fetch(
                        CONFIG.API_BASE + "/statistics"
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Statistics API failed."
                        );
                    }

                    const data = await response.json();
                    setStatistics(data);
                }

                catch (error) {

                    console.error(error);
                    setStatistics(null);
                }

            }, []);


            React.useEffect(() => {

                setProtocolFilter("");

            }, [transportFilter]);

            React.useEffect(() => {

                console.log("Protocol Filter =", protocolFilter);

            }, [protocolFilter]);

            React.useEffect(() => {

                console.log("Filtered =", filteredPackets.length);

            }, [filteredPackets]);

            React.useEffect(() => {
                const timer = setTimeout(() => {
                    setDebouncedSearch(searchText);
                }, CONFIG.SEARCH_DEBOUNCE);
                return () => clearTimeout(timer);
            }, [searchText, CONFIG.SEARCH_DEBOUNCE]);

            React.useEffect(() => {

                const interval = setInterval(() => {

                    refreshDevices();

                }, CONFIG.DEVICE_REFRESH_INTERVAL);

                return () => clearInterval(interval);

            }, [refreshDevices]);


            React.useEffect(() => {

                const timer = setInterval(() => {

                    setCurrentDateTime(
                        new Date().toLocaleString(
                            "en-GB",
                            { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true }

                        )
                    );
                }, CONFIG.CLOCK_REFRESH_INTERVAL);

                return () => clearInterval(timer);

            }, [CONFIG.CLOCK_REFRESH_INTERVAL]);

            React.useEffect(() => {
                refreshDevices();
                loadStatistics();
            }, [refreshDevices, loadStatistics]);

            React.useEffect(() => {

                loadPackets();
                loadServerInfo();
                const interval = setInterval(loadPackets, CONFIG.PACKET_REFRESH_INTERVAL);
                return () => clearInterval(interval);
            }, [
                loadPackets,
                loadServerInfo
            ]);

            React.useEffect(() => {

                const loadFooter = () => {

                    loadServerInfo();
                    loadVersion();
                    loadPing();

                };

                loadFooter();
                const timer = setInterval(loadFooter, CONFIG.FOOTER_REFRESH_INTERVAL);
                return () => clearInterval(timer);

            }, [loadServerInfo, loadVersion, loadPing]);

            const summaryCardStyle = {
                minWidth: "145px",
                padding: "8px 12px",
                border: "1px solid #D5D5D5",
                borderRadius: "8px",
                background: "#FFFFFF",
                textAlign: "center",
                boxShadow: "0 2px 6px rgba(0,0,0,0.12)",
                fontWeight: "600"
            };

            const dashboardButtonStyle = {
                minWidth: "130px",
                height: "30px",
                padding: "4px 12px",
                background: "linear-gradient(to bottom, #F5FAEF 0%, #E4F1D5 100%)",
                border: "1px solid #7A9A3D",
                borderRadius: "4px",
                color: "#2F4F1F",
                fontWeight: "600",
                fontSize: "14px",
                cursor: "pointer",
                boxShadow: "0 1px 4px rgba(85,107,47,0.18)",
                transition: "all 0.2s ease"
            };

            const manufacturerRows = statistics?.manufacturers?.map(
                (manufacturer, index) => [
                    index + 1,
                    manufacturer.name,
                    manufacturer.count
                ]

            ) || [];

            const operatingSystemRows = statistics?.operatingSystems?.map(

                (os, index) => [
                    index + 1,
                    os.name,
                    os.count
                ]

            ) || [];

            const discoveryRows = statistics?.discoveries?.map(

                (item, index) => [
                    index + 1,
                    item.name,
                    item.count
                ]

            ) || [];

            const portRows = statistics?.ports?.map(

                (item, index) => [
                    index + 1,
                    item.name,
                    item.count
                ]

            ) || [];

            const serviceRows = statistics?.services?.map(

                (item, index) => [
                    index + 1,
                    item.name,
                    item.count
                ]

            ) || [];

            const performanceRows = statistics?.performance?.map(

                (item, index) => [
                    index + 1,
                    item.name,
                    item.count
                ]

            ) || [];

            const protocolRows = statistics?.protocols?.map(

                (item, index) => [
                    index + 1,
                    item.name,
                    item.count
                ]

            ) || [];

            function openChart(title, data) {

                setChartTitle(title);
                setChartData(
                    Array.isArray(data)
                        ? data
                        : []
                );
                setShowChartModal(true);
            }

            async function loadTopology() {

                try {

                    setTopologyLoading(true);
                    const response = await fetch("http://127.0.0.1:5000/topology");
                    const data = await response.json();
                    setTopologyData(data);
                    setShowTopology(true);

                } catch (error) {
                    alert("Unable to load topology.");

                } finally {
                    setTopologyLoading(false);
                }
            }

            async function analyzeDevice(device) {

                if (!device) {

                    setDeviceAIResult(null);
                    setDeviceAIError("");
                    setDeviceAILoading(false);

                    return;
                }

                setDeviceAIResult(null);
                setDeviceAIError("");
                setDeviceAILoading(false);

                try {

                    // Temporary dummy result
                    // Backend API will be connected later.

                    const response = await fetch(
                        `${API_BASE_URL}/device-ai-analysis`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(device)
                        }
                    );

                    if (!response.ok) {
                        throw new Error("Failed to analyze device.");
                    }

                    const result = await response.json();
                    console.log("AI Device Result:", result);

                    setDeviceAIResult(result);

                }
                catch (error) {
                    setDeviceAIError(error.message);

                }
                finally {
                    setDeviceAILoading(false);

                }
            }

            /*
            React.useEffect(() => {
      
                if(packetTableRef.current){
      
                    packetTableRef.current.scrollTop =
                        packetTableRef.current.scrollHeight;
      
                }
      
            },[filteredPackets]);
            */

            return (
                <div className="main-container">

                    <div className="header">
                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                            {/*<img src="LnT_logo.png" className="logo" alt="Logo" onError={(e) => e.target.style.display = 'none'} />*/}

                            <button className="logoButton" onClick={handleLogoClick} title="Dashboard">
                                <img src="LnT_logo.png" className="logo" alt="Logo" onError={(e) => e.target.style.display = 'none'} />
                            </button>

                            <h1 className="page-title">Network Monitoring Dash</h1>
                        </div>
                        <HeaderClock currentDateTime={currentDateTime} />
                    </div>

                    <hr className="divider" />

                    <div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", width: "100%", marginTop: "8px", marginBottom: "10px" }}>
                            <h2 style={{ margin: 0, color: "#556B2F", fontWeight: "700", paddingTop: "10px" }}>Devices</h2>
                            <div style={{ display: "flex", gap: "10px", marginTop: "8px" }}>
                                <div style={summaryCardStyle}><div>Scan Duration</div><div>{dashboard.scanDuration}</div></div>
                                <div style={summaryCardStyle}><div>Last Scan</div><div>{dashboard.lastScanTime}</div></div>
                            </div>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", marginBottom: "8px" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                <input className="search-box" value={searchText} onChange={(e) => setSearchText(e.target.value)}
                                    placeholder="Search for a Network Device" />
                                <button onClick={scanNetwork} disabled={scanning || refreshing} className="btn"> {scanning ? "Scanning..." : "Scan Network"} </button>
                                <button onClick={refreshDevices} disabled={refreshing || scanning} className="btn"> {refreshing ? "Refreshing..." : "Refresh"} </button>
                            </div>
                            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "8px" }}>
                                <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                                    {/*
                                        <button className="dashboard-btn" onClick={() => setShowManufacturer(true)}>🏭 Manufacturer</button>
                                        <button className="dashboard-btn" onClick={() => setShowOperatingSystem(true)}>💻 OS</button>
                                        <button className="dashboard-btn" onClick={() => setShowDiscovery(true)}>📡 Discovery</button>
                                        <button className="dashboard-btn" onClick={() => setShowPorts(true)}>🔓 Ports</button>
                                        <button className="dashboard-btn" onClick={() => setShowServices(true)}>⚙ Services</button>
                                        <button className="dashboard-btn" onClick={() => setShowPerformance(true)}>📈 Performance</button>
                                        <button className="dashboard-btn" onClick={() => setShowProtocols(true)}>🔗 Protocols</button>
                                        */}

                                    <button className="dashboard-btn" onClick={() => openChart("🏭 Manufacturer Distribution", statistics?.manufacturers || [])}>📊 Manufacturer</button>
                                    <button className="dashboard-btn" onClick={() => openChart("💻 Operating System Distribution", statistics?.operatingSystems || [])}>💻 OS</button>
                                    <button className="dashboard-btn" onClick={() => openChart("📡 Discovery Statistics", statistics?.discoveries || [])}>📡 Discovery</button>
                                    <button className="dashboard-btn" onClick={() => openChart("🔓 Open Port Distribution", statistics?.ports || [])}>🔓 Ports</button>
                                    <button className="dashboard-btn" onClick={() => openChart("⚙ Service Distribution", statistics?.services || [])}>⚙ Services</button>
                                    <button className="dashboard-btn" onClick={() => openChart("📈 Performance Statistics", statistics?.performance || [])}>📈 Performance</button>
                                    <button className="dashboard-btn" onClick={() => openChart("🔗 Protocol Distribution", statistics?.protocols || [])}>🔗 Protocols</button>
                                    <button className="dashboard-btn" onClick={() => loadTopology()}>🌐 Network Topology</button>
                                </div>
                                <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                                    <button className="dashboard-btn" onClick={() => setShowCommunicationMatrix(true)}>🔀 Communication Matrix</button>
                                    <button className="dashboard-btn" style={{ minWidth: "170px" }} onClick={() => setShowStatistics(!showStatistics)}>
                                        {showStatistics ? "Hide Statistics ▲" : "Show Statistics ▼"}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div style={{ height: "5px" }}></div>
                        {/*
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" }}>
                            <div>
                                <span className="strstyle">
                                    Devices Found : {devices.length}
                                </span>
                                <span>{"  "}||{"  "}</span>
                                <span className="strstyle">
                                    Showing : {filteredDevices.length}
                                </span>
                                <span>{"  "}||{"  "}</span>
                                <span className="strstyle">
                                    Online : {"  "}
                                </span>
                                <span className="strstyle" style={{ color: "#008000" }}>
                                    {deviceStatistics.online}
                                </span>
                                <span>{"  "}||{"  "}</span>
                                <span className="strstyle">
                                    Offline : {"  "}
                                </span>
                                <span className="strstyle" style={{ color: "#C00000" }}>
                                    {deviceStatistics.offline}
                                </span>
                            </div>
                            
                            <div style={{ fontWeight: "bold", color: "#556B2F", minWidth: "250px", textAlign: "right" }}>
                                Last Scan: {lastScanTime || "Never"}
                            </div>
                        </div>
                        */}
                        <DashboardCards dashboard={dashboard} />
                        <StatisticsPanel statistics={statistics} showStatistics={showStatistics} setShowStatistics={setShowStatistics} />

                        <div className="device-table-container">
                            {filteredDevices.length === 0 && (

                                <div style={{ paddingTop: "90px", textAlign: "center" }}>
                                    <div style={{ fontWeight: "bold", fontSize: "18px", color: deviceStatus ? deviceStatus.color : "#556B2F" }}>
                                        {
                                            deviceStatus
                                                ? deviceStatus.title
                                                : "No Active Devices Detected"
                                        }
                                    </div>

                                    <div style={{ marginTop: "10px", color: "#666" }}>
                                        {
                                            deviceStatus
                                                ? deviceStatus.message
                                                : ""
                                        }
                                    </div>
                                </div>
                            )}
                            {filteredDevices.length > 0 && (
                                <table className="device-table">
                                    <thead className="table-header">
                                        <tr>
                                            <th>Sl.</th>
                                            <th>Device Identifier</th>
                                            <th>Hostname</th>
                                            <th>Manufacturer</th>
                                            <th>Model Name</th>
                                            <th>OS</th>
                                            <th>IP Address</th>
                                            <th>MAC Address</th>
                                            {/*
                                            <th>Firmware Version</th>
                                            <th>Last Boot</th>
                                            */}
                                            <th>Capabilities</th>
                                            <th>Risk</th>
                                            <th>Response</th>
                                            <th>Currently Active</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <DeviceTable
                                        sortedDevices={sortedDevices}
                                        handleView={handleView}
                                        scanning={scanning}
                                        refreshing={refreshing}
                                    />
                                </table>
                            )}
                        </div>
                    </div>
                    <DeviceDetailsModal device={selectedDevice} deviceAIResult={deviceAIResult} deviceAILoading={deviceAILoading}
                        deviceAIError={deviceAIError} onAnalyzeDevice={analyzeDevice} onClose={() => setSelectedDevice(null)} />
                    {/*<HorizontalBarChart title="Manufacturer Distribution" data={statistics.manufacturers} />*/}

                    <DashboardStatisticsModal show={showManufacturer} title="🏭 Manufacturer Distribution"
                        headers={["Sl.", "Manufacturer", "Devices"]} rows={manufacturerRows} onClose={() => setShowManufacturer(false)} />
                    <ChartModal show={showChartModal} title={chartTitle} data={chartData} onClose={() => setShowChartModal(false)} />

                    <TrafficAnalysisModal show={showTrafficAnalysis} data={trafficAnalysis} loading={trafficLoading} 
                        onClose={() => setShowTrafficAnalysis(false)} />
                    
                    <DashboardStatisticsModal show={showOperatingSystem} title="💻 Operating System Distribution"
                        headers={["Sl.", "Operating System", "Devices"]} rows={operatingSystemRows} onClose={() => setShowOperatingSystem(false)} />
                    <DashboardStatisticsModal show={showDiscovery} title="📡 Discovery Statistics"
                        headers={["Sl.", "Discovery Source", "Devices"]} rows={discoveryRows} onClose={() => setShowDiscovery(false)} />
                    <DashboardStatisticsModal show={showPorts} title="🔓 Open Port Statistics"
                        headers={["Sl.", "Port", "Devices"]} rows={portRows} onClose={() => setShowPorts(false)} />
                    <DashboardStatisticsModal show={showServices} title="⚙ Service Statistics"
                        headers={["Sl.", "Service", "Devices"]} rows={serviceRows} onClose={() => setShowServices(false)} />
                    <DashboardStatisticsModal show={showPerformance} title="📈 Performance Statistics"
                        headers={["Sl.", "Response Time", "Devices"]} rows={performanceRows} onClose={() => setShowPerformance(false)} />
                    <DashboardStatisticsModal show={showProtocols} title="🔗 Protocol Statistics"
                        headers={["Sl.", "Protocol", "Devices"]} rows={protocolRows} onClose={() => setShowProtocols(false)} />

                    <TopologyModal
                        show={showTopology}
                        topology={topologyData}
                        loading={topologyLoading}

                        zoom={topologyZoom}
                        setZoom={setTopologyZoom}

                        onClose={() => setShowTopology(false)}
                        // onNodeClick={(device) => setSelectedTopologyDevice(device)}
                        onNodeClick={(device) => setSelectedDevice(device)}
                    />
                    <CommunicationMatrixModal
                        show={showCommunicationMatrix}
                        communications={[]}
                        onClose={() => setShowCommunicationMatrix(false)}
                    />
                    {/*}
                    <DeviceDetailsModal device={selectedTopologyDevice} deviceAIResult={deviceAIResult} deviceAILoading={deviceAILoading}
                        deviceAIError={deviceAIError} onAnalyzeDevice={analyzeDevice} onClose={() => setSelectedTopologyDevice(null)} /> 
                    */}
                    <div style={{ padding: "4px 0" }}>
                        <hr className="divider" />
                    </div>
                    <div>
                        <h2 style={{ margin: 0, color: "#556B2F", padding: "8px 0" }}>Live Packet Capture</h2>

                        <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                            <input className="search-box" type="text" placeholder="Search Source / Destination / Protocol..." value={packetSearch}
                                onChange={(e) => setPacketSearch(e.target.value)} />

                            <div className="filter-group" style={{ marginLeft: "8px" }}>
                                <label className="filter-label">Transport :</label>
                                <select className="filter-dropdown" value={transportFilter} onChange={(e) => setTransportFilter(e.target.value)}>
                                    <option value="">Select</option>
                                    <option value="TCP">TCP</option>
                                    <option value="UDP">UDP</option>
                                    <option value="UNKNOWN">Unknown</option>
                                </select>
                            </div>
                            <div className="filter-group">
                                <label className="filter-label">Protocol :</label>
                                <select className="filter-dropdown" value={protocolFilter} onChange={(e) => setProtocolFilter(e.target.value)} disabled={!transportFilter}>
                                    <option value="">Select</option>
                                    {protocolOptions.map(protocol => (<option key={protocol} value={protocol}>{protocol}</option>))}
                                </select>
                            </div>
                            <button className="btn" onClick={loadTrafficAnalysis} style={{ marginLeft: "8px", minWidth: "170px" }}> 📊 Traffic Analysis </button>
                            <button className="btn" onClick={loadRiskAnalysis} style={{ marginLeft: "8px", minWidth: "170px" }}> ⚠️ Risk Analysis </button>
                        </div>
                        <p />
                        <div style={{
                            display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "10px", marginBottom: "10px",
                            fontWeight: "bold", flexWrap: "wrap"
                        }}>

                            <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                                <span>Packets Captured : {filteredPacketCount}</span>
                                <span>||</span>
                                <span>Packets Showing : {filteredPacketCount}</span>
                            </div>
                            <div className="packet-summary-group">
                                <span style={{ fontWeight: "bold" }}>Total : {packetSummary.total}</span>
                                {
                                    Object.entries(packetSummary.counts).map(([name, count]) =>
                                        <span key={name} style={{ color: getProtocolColor(name), fontWeight: "bold" }}>{name} : {count}</span>)
                                }
                            </div>
                        </div>
                        <div ref={packetTableRef} className="packet-table-container">
                            <PacketTable
                                filteredPackets={filteredPackets}
                                selectedPacket={selectedPacket}
                                setSelectedPacket={setSelectedPacket}
                                setSelectedWSPacket={setSelectedWSPacket}
                                setPacketAIResult={setPacketAIResult}
                                setPacketAIError={setPacketAIError}
                                setPacketAILoading={setPacketAILoading}
                            />
                        </div>
                    </div>
                    <div style={{ marginTop: "15px", padding: "15px", border: "1px solid #ddd", borderRadius: "6px", background: "#fafafa" }}>
                        <h3 style={{ marginTop: 0 }}> Packet Details </h3>
                        {
                            selectedWSPacket ?
                                <div>
                                    <p><b>Time :</b> {selectedWSPacket.time}</p>
                                    <p><b>Interface :</b> {selectedWSPacket.interface}</p>
                                    <p><b>Source :</b> {selectedWSPacket.source}</p>
                                    <p><b>Destination :</b> {selectedWSPacket.destination}</p>
                                    <p><b>Protocol :</b> {selectedWSPacket.protocol}</p>
                                    <p><b>Length :</b> {selectedWSPacket.length} Bytes</p>
                                </div>
                                :
                                <div style={{ color: "#888" }}> Click a packet to view details. </div>
                        }
                    </div>
                    <hr />
                    <PacketDetailsModal
                        packet={selectedPacket} aiResult={packetAIResult} aiLoading={packetAILoading} aiError={packetAIError} onAnalyze={analyzePacket}
                        onDeepAnalysis={deepAnalyzePacket} onShowArchitecture={() => { setShowPacketArchitecture(true); }} onClose={() => setSelectedPacket(null)} />
                    <PacketArchitectureModal open={showPacketArchitecture} onClose={() => setShowPacketArchitecture(false)} />
                    <TrafficAnalysisModal show={showTrafficAnalysis} analysis={trafficAnalysis} onClose={() => setShowTrafficAnalysis(false)} />
                    <RiskAnalysisModal show={showRiskAnalysis} analysis={riskAnalysis} onClose={() => setShowRiskAnalysis(false)} />
                    <DeepAnalysisModal style={{
                        position: "fixed", top: "50%", left: `calc(20% + ${PACKET_DETAILS_WIDTH / 2 + MODAL_GAP}px)`,
                        transform: "translateY(-90%)", width: `${DEEP_ANALYSIS_WIDTH}px`, height: "720px", background: "#FFFFFF", border: "1px solid #B5B5B5",
                        borderRadius: "10px", boxShadow: "0 18px 45px rgba(0,0,0,0.45)", zIndex: 10001, padding: "20px", overflowY: "auto"
                    }}
                        open={showDeepAnalysis}
                        packet={selectedDeepPacket}
                        result={deepAnalysisResult}
                        loading={deepAnalysisLoading}
                        error={deepAnalysisError}
                        onClose={() => {
                            setShowDeepAnalysis(false);
                            setSelectedDeepPacket(null);
                        }}
                        onShowArchitecture={() =>
                            setShowDeepArchitecture(true)
                        }
                    />
                    <DeepArchitectureModal open={showDeepArchitecture} onClose={() => setShowDeepArchitecture(false)} />
                    <SystemArchitectureModal open={showSystemArchitecture} onClose={() => setShowSystemArchitecture(false)} />
                    <FooterBar apiVersion={apiVersion} serverStatus={serverStatus} footerTime={footerTime} versionInfo={versionInfo} refreshInterval={CONFIG.FOOTER_REFRESH_INTERVAL} />
                    <hr />
                </div>

            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<DashUI />);

    </script>
</body>

</html>
