<!DOCTYPE html>
<html>

<head>
    <title>Network Scan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

        const API_BASE_URL = "http://127.0.0.1:5000";

        function getProtocolColor(protocol) {

            switch ((protocol || "").toUpperCase()) {
                case "TCP": return "#1565C0";
                case "UDP": return "#2E7D32";
                case "ICMP": return "#EF6C00";
                case "ARP": return "#8E24AA";
                case "HTTP": return "#795548";
                case "HTTPS": return "#00695C";
                case "DNS": return "#00897B";
                default: return "#616161";
            }
        }

        /*COMMON INLINE STYLES*/
        const styles = {

            analysisSectionHeader: {
                color: "#FFFFFF",
                fontWeight: "700",
                fontSize: "18px",
                textAlign: "center",
                padding: "10px"
            },

            modalHeader: {
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center"
            },

            modalFooter: {
                display: "flex",
                justifyContent: "flex-end",
                marginTop: "20px"
            },

            closeButton: {
                border: "none",
                background: "none",
                cursor: "pointer",
                fontWeight: "bold",
                fontSize: "18px"
            },

            centerMessage: {
                textAlign: "center",
                padding: "30px",
                color: "#666",
                fontWeight: "600"
            },

            tableFullWidth: {
                width: "100%",
                borderCollapse: "collapse"
            },

            contextMenuItem: {
                padding: "10px",
                cursor: "pointer",
                transition: "0.2s",
            }

        };

        const PacketTable = React.memo(function PacketTable({

            filteredPackets,
            selectedPacket,
            setSelectedPacket,
            setSelectedWSPacket,
            setPacketAIResult,
            setPacketAIError,
            setPacketAILoading

        }) {

            return (

                <table className="device-table">
                    <thead className="table-header">
                        <tr>
                            <th>Sl.</th>
                            <th>Time</th>
                            <th>Pkt. ID</th>
                            <th>Interface</th>
                            <th>Source</th>
                            <th>S-Port</th>
                            <th>Destination</th>
                            <th>D-Port</th>
                            <th>Protocol</th>
                            <th>Length</th>
                            <th>Risk</th>
                            <th>Flags</th>
                            <th>Info</th>
                        </tr>
                    </thead>
                    <tbody>

                        {filteredPackets.map((packet, index) => (
                            <tr
                                key={`${packet.id}-${index}`}
                                onClick={() => {
                                    setSelectedPacket(packet);
                                    setSelectedWSPacket(packet);
                                    setPacketAIResult(null);
                                    setPacketAIError("");
                                    setPacketAILoading(false);
                                }}
                                style={{
                                    cursor: "pointer",
                                    backgroundColor:
                                        selectedPacket === packet
                                            ? "#dbeafe"
                                            : "white"
                                }}
                            >

                                <td>{index + 1}</td>
                                <td>{packet.time}</td>
                                <td>{packet.id}</td>
                                <td>{packet.interface}</td>
                                <td>{packet.source}</td>
                                <td>{packet.sourcePort}</td>
                                <td>{packet.destination}</td>
                                <td>{packet.destinationPort}</td>

                                <td
                                    style={{
                                        color: getProtocolColor(packet.protocol),
                                        fontWeight: "bold"
                                    }}
                                >
                                    {packet.protocol}
                                </td>

                                <td>{packet.length}</td>
                                <td style={{ textAlign: "center", verticalAlign: "middle" }}>
                                    <span style={{
                                        display: "inline-block", minWidth: "72px", padding: "4px 12px", borderRadius: "14px", fontSize: "13px", fontWeight: "700",
                                        color: "#FFFFFF",
                                        background:
                                            packet.riskLevel === "Critical"
                                                ? "#C62828"
                                                : packet.riskLevel === "High"
                                                    ? "#EF6C00"
                                                    : packet.riskLevel === "Medium"
                                                        ? "#F9A825"
                                                        : "#43A047"
                                    }}>{packet.riskLevel || "Low"}</span>
                                </td>

                                <td style={{ textAlign: "center", verticalAlign: "middle" }}>
                                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "4px" }}>
                                        <div style={{ width: "100px", height: "12px", fontWeight: "600", background: "#ddd", borderRadius: "8px", overflow: "hidden" }}>
                                            <div style={{
                                                width: `${packet.riskScore || 0}%`, height: "100%", backgroundColor:
                                                    packet.riskScore >= 80 ? "#d32f2f"
                                                        : packet.riskScore >= 60 ? "#f57c00"
                                                            : packet.riskScore >= 40 ? "#F9A825"
                                                                : "#43a047"
                                            }} />
                                        </div>
                                        <span style={{
                                            fontSize: "13px", fontWeight: "700",
                                            color:
                                                packet.riskScore >= 80
                                                    ? "#C62828"
                                                    : packet.riskScore >= 60
                                                        ? "#EF6C00"
                                                        : packet.riskScore >= 40
                                                            ? "#F9A825"
                                                            : "#2E7D32"
                                        }}>{packet.riskScore || 0}/100</span>
                                    </div>
                                </td>
                                <td>{packet.info}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            );
        });

        const DeviceTable = React.memo(function DeviceTable({

            sortedDevices,
            handleView,
            scanning,
            refreshing

        }) {

            return (
                <tbody>
                    {sortedDevices.map((device, index) => (
                        <tr key={`${device.ip}-${device.mac}-${device.endpointId}`}>
                            <td>{index + 1}</td>
                            <td
                                style={{
                                    fontWeight: "bold",
                                    color: "#6B5E00"
                                }}
                            >
                                {device.endpointId || "-"}
                            </td>
                            <td>{device.hostname || "-"}</td>
                            <td>{device.manufacturer || "-"}</td>
                            <td>{device.model || "-"}</td>
                            <td>{device.operatingSystem || "-"}</td>
                            <td>{device.ip || "-"}</td>
                            <td>{device.mac || "-"}</td>
                            <td style={{ textAlign: "center", whiteSpace: "nowrap", fontSize: "18px" }}>
                                <span title="HTTP/HTTPS">{device.httpBannerDetected ? "🌐 " : ""}</span>
                                <span title="HTTPS">{device.httpScheme === "HTTPS" ? "🔒 " : ""}</span>
                                <span title="SNMP">{device.snmpEnabled ? "📡 " : ""}</span>
                                <span title="LLDP">{device.lldpSystemName ? "🔗 " : ""}</span>
                                <span title="CDP">{device.cdpDeviceId ? "🖧 " : ""}</span>
                                <span title="UPnP">{(device.discoverySource || "").includes("UPnP") ? "📺 " : ""}</span>
                                <span title="mDNS">{(device.discoverySource || "").includes("mDNS") ? "📢 " : ""}</span>
                                <span title="NetBIOS">{(device.discoverySource || "").includes("NetBIOS") ? "💻" : ""}</span>
                                <span title="SSH">{device.sshBannerDetected ? "🔑 " : ""}</span>
                            </td>
                            <td>{device.responseTime || "-"}</td>
                            <td style={{ textAlign: "center" }}>
                                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" }}>
                                    <div style={{ width: "70px", height: "10px", background: "#DDD", borderRadius: "8px", overflow: "hidden" }}>
                                        <div style={{
                                            width: `${device.deviceRiskScore || 0}%`, height: "100%", background:
                                                device.deviceRiskScore >= 80 ? "#C62828"
                                                    : device.deviceRiskScore >= 60 ? "#EF6C00"
                                                        : device.deviceRiskScore >= 40 ? "#F9A825"
                                                            : "#43A047"
                                        }} />
                                    </div>
                                    <span style={{ fontSize: "12px", fontWeight: "700" }}>{device.deviceRiskScore || 0}/100</span>
                                </div>
                            </td>
                            <td
                                style={{
                                    padding: "4px 18px",
                                    textAlign: "left",
                                    color: device.active
                                        ? "#008000"
                                        : "#C00000",
                                    fontWeight: "bold"
                                }}
                            >
                                {device.active
                                    ? "Online"
                                    : "Offline"}
                            </td>
                            <td
                                style={{
                                    padding: "8px",
                                    whiteSpace: "nowrap"
                                }}
                            >
                                <button
                                    className="btn"
                                    onClick={() => handleView(device)}
                                    disabled={scanning || refreshing}
                                >
                                    👁 View
                                </button>
                            </td>
                        </tr>
                    ))}
                </tbody>
            );
        });

        const HeaderClock = React.memo(function HeaderClock({ currentDateTime }) {
            return (
                <p className="datetime">Date & Time : {currentDateTime}</p>
            );
        });

        const HorizontalBarChart = React.memo(function HorizontalBarChart({

            data

        }) {

            const chartData = Array.isArray(data)
                ? data
                : [];

            if (chartData.length === 0) {

                return (
                    <div style={styles.centerMessage}>
                        No statistics available
                    </div>
                );

            }

            const maxValue = Math.max(
                ...chartData.map(item => item?.count || 0),
                1
            );

            return (

                <div>

                    {chartData.map((item, index) => (

                        <div
                            key={`${item.name}-${item.count}`}
                            style={{
                                display: "flex",
                                alignItems: "center",
                                marginBottom: "12px"
                            }}
                        >

                            <div
                                style={{
                                    width: "260px",
                                    fontWeight: "600"
                                }}
                            >
                                <div
                                    title={item.name}
                                    style={{
                                        wordBreak: "break-word",
                                        lineHeight: "16px",
                                        fontSize: "13px"
                                    }}
                                >
                                    {item.name}
                                </div>
                            </div>

                            <div
                                style={{
                                    flex: 1,
                                    minWidth: "180px",
                                    background: "#E5E5E5",
                                    height: "24px",
                                    borderRadius: "5px",
                                    overflow: "hidden"
                                }}
                            >

                                <div
                                    style={{
                                        width: `${(item.count / maxValue) * 100}%`,
                                        background: "#556B2F",
                                        height: "100%"
                                    }}
                                />

                            </div>

                            <div
                                style={{
                                    width: "50px",
                                    textAlign: "right",
                                    fontWeight: "700",
                                    marginLeft: "10px"
                                }}
                            >
                                {item.count}
                            </div>
                        </div>
                    ))}
                </div>
            );
        });

        const ChartModal = React.memo(function ChartModal({

            show,
            title,
            data,
            onClose

        }) {

            if (!show) {
                return null;
            }

            return (

                <div
                    className="modal-overlay"
                    onClick={onClose}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "850px",
                            maxWidth: "95%",
                            maxHeight: "80vh",
                            overflowY: "auto"
                        }}
                        onClick={(e) => e.stopPropagation()}
                    >

                        <div style={styles.modalHeader}>

                            <h2>{title}</h2>
                            <button
                                onClick={onClose}
                                style={styles.closeButton}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider" />

                        <HorizontalBarChart
                            data={data}
                        />

                        <div style={styles.modalFooter}>
                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        });

        const TrafficAnalysisModal = React.memo(function TrafficAnalysisModal({

            show,
            data,
            loading,
            onClose

        }) {

            if (!show)
                return null;

            const device = data?.device || {};

            return (

                <div
                    className="modal-overlay"
                    onClick={onClose}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "950px",
                            maxWidth: "95%",
                            maxHeight: "85vh",
                            overflowY: "auto"
                        }}
                        onClick={(e)=>e.stopPropagation()}
                    >

                        <div style={styles.modalHeader}>

                            <h2>
                                📊 Traffic Analysis
                            </h2>

                            <button
                                style={styles.closeButton}
                                onClick={onClose}
                            >
                                ✕
                            </button>

                        </div>

                        <hr className="divider"/>

                        {
                            loading
                            ? (
                                <div style={styles.centerMessage}>
                                    Loading...
                                </div>
                            )
                            : (
                                <div>

                                    <h3 style={styles.analysisSectionHeader}>
                                        Device Information
                                    </h3>

                                    <table className="device-table">

                                        <tbody>

                                            <tr>
                                                <td><b>Hostname</b></td>
                                                <td>{device.hostname || "-"}</td>
                                            </tr>

                                            <tr>
                                                <td><b>IP Address</b></td>
                                                <td>{device.ip || "-"}</td>
                                            </tr>

                                            <tr>
                                                <td><b>MAC Address</b></td>
                                                <td>{device.mac || "-"}</td>
                                            </tr>

                                            <tr>
                                                <td><b>Manufacturer</b></td>
                                                <td>{device.manufacturer || "-"}</td>
                                            </tr>

                                            <tr>
                                                <td><b>Model</b></td>
                                                <td>{device.model || "-"}</td>
                                            </tr>

                                            <tr>
                                                <td><b>Operating System</b></td>
                                                <td>{device.operatingSystem || "-"}</td>
                                            </tr>

                                        </tbody>

                                    </table>

                                </div>
                            )
                        }
                        <hr className="divider" />

                        <h3 style={styles.analysisSectionHeader}>
                            Traffic Summary
                        </h3>

                        <table
                            className="device-table"
                            style={styles.tableFullWidth}
                        >

                            <tbody>

                                <tr>
                                    <td><b>Total Packets</b></td>
                                    <td>{device.totalPackets || "-"}</td>

                                    <td><b>Total Bytes</b></td>
                                    <td>{device.totalBytes || "-"}</td>
                                </tr>

                                <tr>
                                    <td><b>Bandwidth</b></td>
                                    <td>{device.bandwidth || "-"}</td>

                                    <td><b>Connections</b></td>
                                    <td>{device.connections || "-"}</td>
                                </tr>

                                <tr>
                                    <td><b>Average Packet Size</b></td>
                                    <td>{device.averagePacketSize || "-"}</td>

                                    <td><b>Capture Duration</b></td>
                                    <td>{device.captureDuration || "-"}</td>
                                </tr>

                            </tbody>

                        </table>
                        <hr className="divider" />

                        <h3 style={styles.analysisSectionHeader}>
                            Protocol Statistics
                        </h3>

                        <table
                            className="device-table"
                            style={styles.tableFullWidth}
                        >
                            <thead>
                                <tr>
                                    <th>Sl.</th>
                                    <th>Protocol</th>
                                    <th>Packets</th>
                                </tr>
                            </thead>

                            <tbody>

                                {(device.protocolStatistics || []).map((item, index) => (

                                    <tr key={item.protocol}>

                                        <td>{index + 1}</td>

                                        <td
                                            style={{
                                                color: getProtocolColor(item.protocol),
                                                fontWeight: "700"
                                            }}
                                        >
                                            {item.protocol}
                                        </td>

                                        <td>{item.packets}</td>

                                    </tr>

                                ))}

                                {(device.protocolStatistics || []).length === 0 && (

                                    <tr>

                                        <td
                                            colSpan="3"
                                            style={{
                                                textAlign: "center",
                                                padding: "20px"
                                            }}
                                        >
                                            No protocol statistics available.
                                        </td>

                                    </tr>

                                )}

                            </tbody>

                        </table>

                        <div style={styles.modalFooter}>

                            <button
                                className="btn"
                                onClick={onClose}
                            >
                                Close
                            </button>

                        </div>

                    </div>

                </div>

            );

        });
        
        const NetworkNode = React.memo(function NetworkNode({

            icon,
            title,
            subtitle,

            manufacturer,
            deviceType,

            macAddress,
            vendor,

            connectionType,
            riskLevel,
            riskScore,
            riskReason,
            status,

            parentName,
            childCount,
            topologyLevel,
            linkConfidence,
            highlight,

            onClick,
            onContextMenu

        }) {

            const nodeBackground = (() => {

                if (riskLevel === "Critical")
                    return "#FFEBEE";

                if (riskLevel === "High")
                    return "#FFF3E0";

                if (riskLevel === "Medium")
                    return "#FFFDE7";

                const type = (deviceType || "").toLowerCase();

                if (type.includes("gateway"))
                    return "#E3F2FD";

                if (type.includes("router"))
                    return "#E8EAF6";

                if (type.includes("switch"))
                    return "#F3E5F5";

                if (type.includes("access point"))
                    return "#E0F7FA";

                if (type.includes("server"))
                    return "#F1F8E9";

                if (type.includes("nas"))
                    return "#F1F8E9";

                if (type.includes("printer"))
                    return "#FCE4EC";

                if (type.includes("camera"))
                    return "#F3E5F5";

                if (type.includes("android"))
                    return "#E8F5E9";

                if (type.includes("iphone"))
                    return "#ECEFF1";

                if (type.includes("windows"))
                    return "#E3F2FD";

                if (type.includes("linux"))
                    return "#FFFDE7";

                return "#FFFFFF";

            })();

            const borderColor =
                riskLevel === "Critical"
                    ? "#C62828"
                    : riskLevel === "High"
                        ? "#EF6C00"
                        : riskLevel === "Medium"
                            ? "#F9A825"
                            : "#43A047";

            return (

                <div
                    onClick={onClick}
                    onContextMenu={onContextMenu}
                    style={{
                        width: "180px",
                        border:
                            highlight
                                ? "4px solid #FFC107"
                                : `2px solid ${borderColor}`,
                        borderRadius: "8px",
                        padding: "12px",
                        textAlign: "center",
                        background: nodeBackground,
                        boxShadow:
                            highlight
                                ? "0 0 18px 4px rgba(255,193,7,0.9)"
                                : connectionType === "Wireless"
                                    ? "0 2px 12px rgba(21,101,192,0.35)"
                                    : "0 2px 8px rgba(0,0,0,0.15)",
                        cursor: "pointer",
                        transform: highlight ? "scale(1.05)" : "scale(1)",
                        transition: "all 0.25s ease"
                    }}
                >

                    <div style={{ fontSize: "34px" }}>

                        {icon}

                    </div>

                    <div
                        style={{
                            fontWeight: "700",
                            marginTop: "8px"
                        }}
                    >

                        {title}

                    </div>

                    <div
                        style={{
                            color: "#666",
                            fontSize: "13px",
                            marginTop: "3px"
                        }}
                    >
                        <div>{subtitle}</div>

                        <div
                            style={{
                                fontSize: "11px",
                                color: "#1565C0",
                                marginTop: "2px"
                            }}
                        >
                            {macAddress || "-"}
                        </div>

                        <div
                            style={{
                                fontSize: "11px",
                                color: "#777777"
                            }}
                        >
                            {vendor || "-"}
                        </div>
                    </div>

                    <div
                        style={{
                            marginTop: "8px",
                            fontSize: "12px",
                            color: "#666"
                        }}
                    >
                        {manufacturer || "-"}
                    </div>
                    <div
                        style={{
                            marginTop: "3px",
                            fontSize: "12px",
                            color: "#1565C0",
                            fontWeight: "600",

                            width: "100%",
                            overflowWrap: "anywhere",
                            wordBreak: "break-word",
                            whiteSpace: "normal",
                            lineHeight: "16px"
                        }}
                    >
                        {formatDeviceType(deviceType)}
                    </div>
                    <div
                        style={{
                            marginTop: "4px",
                            fontSize: "13px",
                            fontWeight: "600"
                        }}
                    >
                        {
                            connectionType === "Gateway"
                                ? "🌐 Gateway"
                                : connectionType === "Wireless"
                                    ? "📶 WiFi"
                                    : connectionType === "Switch"
                                        ? "🖧 Switch"
                                        : connectionType === "Wired"
                                            ? "🔌 Ethernet"
                                            : "❓ Unknown"
                        }
                    </div>
                    <div
                        style={{
                            marginTop: "6px",
                            fontWeight: "700",
                            color:
                                riskLevel === "Critical"
                                    ? "#C62828"
                                    : riskLevel === "High"
                                        ? "#EF6C00"
                                        : riskLevel === "Medium"
                                            ? "#F9A825"
                                            : "#2E7D32"
                        }}
                    >
                        {riskLevel || "Low"}
                    </div>
                    <div
                        style={{
                            marginTop: "6px"
                        }}
                    >
                        <div
                            style={{
                                height: "8px",
                                background: "#DDDDDD",
                                borderRadius: "5px",
                                overflow: "hidden"
                            }}
                        >
                            <div
                                style={{
                                    width: `${riskScore || 0}%`,
                                    height: "100%",
                                    background:
                                        riskScore >= 80
                                            ? "#C62828"
                                            : riskScore >= 60
                                                ? "#EF6C00"
                                                : riskScore >= 40
                                                    ? "#F9A825"
                                                    : "#43A047"
                                }}
                            />
                        </div>

                        <div
                            style={{
                                fontSize: "11px",
                                fontWeight: "700",
                                marginTop: "3px"
                            }}
                        >
                            {riskScore || 0}/100
                        </div>
                        <div
                            style={{
                                marginTop: "6px",
                                fontSize: "10px",
                                color: "#666666",
                                lineHeight: "14px",
                                minHeight: "28px"
                            }}
                        >
                            {riskReason || "No security findings"}
                        </div>
                    </div>
                    <div
                        style={{
                            marginTop: "6px",
                            fontSize: "12px",
                            fontWeight: "700",
                            color: status ? "#2E7D32" : "#C62828"
                        }}
                    >
                        {status ? "🟢 Online" : "🔴 Offline"}
                    </div>
                    <div
                        style={{
                            marginTop: "4px",
                            fontSize: "11px",
                            color: "#666666"
                        }}
                    >
                        <b>Last Seen</b><br />
                        {getLastSeen({
                            active: status,
                            lastSeen: linkConfidence
                        })}
                    </div>
                    <div
                        style={{
                            marginTop: "10px",
                            paddingTop: "8px",
                            borderTop: "1px solid #DDDDDD",
                            fontSize: "11px",
                            textAlign: "left",
                            color: "#555555"
                        }}
                    >

                        <div>
                            <b>Parent :</b> {parentName || "-"}
                        </div>

                        <div>
                            <b>Children :</b> {childCount || 0}
                        </div>

                        <div>
                            <b>Level :</b> {topologyLevel || "-"}
                        </div>

                        <div>
                            <b>Confidence :</b> {linkConfidence || "-"}
                        </div>

                    </div>
                </div>
            );
        });

        const LinkLabel = React.memo(function LinkLabel({ text, wireless = false }) {

            if (!text) return null;

            return (
                <div
                    style={{
                        margin: "4px 0",
                        padding: "2px 8px",
                        borderRadius: "10px",
                        fontSize: "11px",
                        fontWeight: "700",
                        color: wireless ? "#1565C0" : "#2E7D32",
                        background: wireless ? "#E3F2FD" : "#E8F5E9",
                        border: wireless
                            ? "1px dashed #1565C0"
                            : "1px solid #2E7D32"
                    }}
                >
                    {text}
                </div>
            );

        });

        function getDeviceIcon(deviceType) {

            const type = (deviceType || "").toLowerCase();

            if (type.includes("gateway")) return "🌐";
            if (type.includes("router")) return "📡";
            if (type.includes("switch")) return "🖧";
            if (type.includes("access point")) return "📶";
            if (type.includes("wireless")) return "📶";

            if (type.includes("printer")) return "🖨️";
            if (type.includes("camera")) return "📷";
            if (type.includes("nas")) return "💾";
            if (type.includes("storage")) return "💾";
            if (type.includes("server")) return "🖥️";

            if (type.includes("windows")) return "💻";
            if (type.includes("linux")) return "🐧";
            if (type.includes("mac")) return "🍎";

            if (type.includes("android")) return "📱";
            if (type.includes("iphone")) return "📱";
            if (type.includes("ios")) return "📱";
            if (type.includes("mobile")) return "📱";
            if (type.includes("tablet")) return "📱";

            if (type.includes("tv")) return "📺";
            if (type.includes("smart tv")) return "📺";
            if (type.includes("chromecast")) return "📺";
            if (type.includes("roku")) return "📺";
            if (type.includes("fire tv")) return "📺";
            if (type.includes("apple tv")) return "📺";

            if (type.includes("voip")) return "☎️";
            if (type.includes("phone")) return "☎️";

            if (type.includes("iot")) return "🔌";
            if (type.includes("sensor")) return "🌡️";

            return "🖥️";
        }

        function getDevicePriority(device) {

            const type = (device.deviceType || "").toLowerCase();

            if (type.includes("gateway")) return 1;
            if (type.includes("router")) return 2;
            if (type.includes("switch")) return 3;
            if (type.includes("access point")) return 4;

            if (type.includes("server")) return 5;
            if (type.includes("nas")) return 6;
            if (type.includes("storage")) return 6;

            if (type.includes("printer")) return 7;
            if (type.includes("camera")) return 8;

            if (type.includes("windows")) return 9;
            if (type.includes("linux")) return 9;
            if (type.includes("mac")) return 9;

            if (type.includes("android")) return 10;
            if (type.includes("iphone")) return 10;
            if (type.includes("ios")) return 10;

            if (type.includes("tv")) return 11;

            return 99;

        }

        function getLinkLabel(device) {

            if (!device)
                return "-";

            if (device.connectionType === "Wireless") {

                return (
                    device.wifiStandard ||
                    device.wifiGeneration ||
                    device.wifiProtocol ||
                    device.wifiBand ||
                    "WiFi"
                );
            }

            return (
                device.linkSpeed ||
                device.portSpeed ||
                device.interfaceSpeed ||
                device.interfaceName ||
                "Ethernet"
            );
        }

        function getLinkQuality(device) {

            if (!device)
                return {
                    text: "-",
                    color: "#666666"
                };

            const speed =
                (device.linkSpeed ||
                    device.portSpeed ||
                    device.interfaceSpeed ||
                    "").toString().toLowerCase();

            if (speed.includes("10 gb"))
                return { text: "★★★★★ Excellent", color: "#2E7D32" };

            if (speed.includes("1 gb"))
                return { text: "★★★★☆ Excellent", color: "#43A047" };

            if (speed.includes("100"))
                return { text: "★★★☆☆ Good", color: "#F9A825" };

            if (speed.includes("10"))
                return { text: "★★☆☆☆ Poor", color: "#EF6C00" };

            if (device.connectionType === "Wireless") {

                const wifi =
                    (
                        device.wifiStandard ||
                        device.wifiGeneration ||
                        ""
                    ).toLowerCase();

                if (wifi.includes("wifi 7"))
                    return { text: "★★★★★ Excellent", color: "#2E7D32" };

                if (wifi.includes("wifi 6"))
                    return { text: "★★★★☆ Excellent", color: "#43A047" };

                if (wifi.includes("802.11ac"))
                    return { text: "★★★☆☆ Good", color: "#F9A825" };

                if (wifi.includes("802.11n"))
                    return { text: "★★☆☆☆ Fair", color: "#EF6C00" };
            }

            return {
                text: "Unknown",
                color: "#666666"
            };
        }

        function getLinkColor(device) {

            const speed =
                (
                    device.linkSpeed ||
                    device.portSpeed ||
                    device.interfaceSpeed ||
                    ""
                ).toLowerCase();

            if (speed.includes("10 gb"))
                return "#2E7D32";

            if (speed.includes("1 gb"))
                return "#43A047";

            if (speed.includes("100"))
                return "#F9A825";

            if (speed.includes("10"))
                return "#C62828";

            if (device.connectionType === "Wireless")
                return "#1565C0";

            return "#777777";

        }

        function getConnectionDescription(device) {

            if (!device)
                return "-";

            if (device.connectionType === "Wireless") {

                return [
                    device.wifiStandard,
                    device.wifiBand,
                    device.channelWidth,
                    device.rssi && `RSSI ${device.rssi}`,
                    device.confidence && `Confidence ${device.confidence}`
                ]
                    .filter(Boolean)
                    .join(" • ");
            }

            return [
                device.linkSpeed,
                device.duplex,
                device.interfaceName,
                device.confidence && `Confidence ${device.confidence}`
            ]
                .filter(Boolean)
                .join(" • ");
        }

        function getLastSeen(device) {

            if (!device)
                return "-";

            if (device.active)
                return "Just Now";

            return (
                device.lastSeen ||
                device.lastSeenTime ||
                device.lastDiscovery ||
                "-"
            );
        }

        function getInterfaceName(device) {

            if (!device)
                return "-";

            return (
                device.interfaceName ||
                device.interface ||
                device.portName ||
                device.portId ||
                device.lldpPortId ||
                device.cdpPortId ||
                "Unknown Port"
            );

        }

        function formatDeviceType(deviceType) {

            if (!deviceType)
                return "-";

            if (deviceType.startsWith("urn:")) {

                const parts = deviceType.split(":");

                return parts[parts.length - 2]
                    .replace(/([a-z])([A-Z])/g, "$1 $2");
            }

            return deviceType;
        }

        function buildTopologyStatistics(topology) {

            const devices = topology?.devices || [];

            return {

                online:
                    devices.filter(d => d.active).length,

                offline:
                    devices.filter(d => !d.active).length,

                wired:
                    devices.filter(
                        d => d.connectionType === "Wired"
                    ).length,

                wireless:
                    devices.filter(
                        d => d.connectionType === "Wireless"
                    ).length,

                critical:
                    devices.filter(
                        d => d.deviceRiskLevel === "Critical"
                    ).length,

                high:
                    devices.filter(
                        d => d.deviceRiskLevel === "High"
                    ).length,

                medium:
                    devices.filter(
                        d => d.deviceRiskLevel === "Medium"
                    ).length,

                low:
                    devices.filter(
                        d =>
                            !d.deviceRiskLevel ||
                            d.deviceRiskLevel === "Low"
                    ).length

            };

        }

        const TopologyModal = React.memo(function TopologyModal({

            show,
            topology,
            loading,

            zoom,
            setZoom,

            onClose,
            onNodeClick

        }) {

            if (!show) { return null; }

            function getChildren(parentId) {

                return (topology?.devices || []).filter(
                    device => device.parentId === parentId
                );

            }

            function getBranchWidth(endpointId) {

                const children = getChildren(endpointId);

                if (children.length === 0) {
                    return NODE_WIDTH;
                }

                return Math.max(
                    children.reduce(
                        (total, child) => total + getBranchWidth(child.endpointId),
                        0
                    ),
                    NODE_WIDTH
                );

            }

            function CurvedConnector({ childCount, width, linkColor }) {

                return (

                    <svg
                        width={width}
                        height="70"
                        style={{
                            overflow: "visible",
                            display: "block"
                        }}
                    >
                        <defs>

                            <marker
                                id="arrowHead"
                                markerWidth="10"
                                markerHeight="10"
                                refX="5"
                                refY="3"
                                orient="auto"
                            >

                                <polygon
                                    points="0 0, 6 3, 0 6"
                                    fill={linkColor}
                                />

                            </marker>

                        </defs>
                        <style>{`

                    @keyframes packetFlow {

                        from {
                            offset-distance:0%;
                        }

                        to {
                            offset-distance:100%;
                        }
                    }
                    @keyframes packetDown {

                        from {
                            top:0px;
                        }

                        to {
                            top:28px;
                        }

                    }

                    `}</style>

                        {/* Vertical line */}

                        <line
                            x1={width / 2}
                            y1="0"
                            x2={width / 2}
                            y2="20"
                            stroke={linkColor}
                            strokeWidth="3"
                            markerEnd="url(#arrowHead)"
                        />
                        <circle
                            r="4"
                            fill="#1565C0"
                        >

                            <animateMotion
                                dur="1.2s"
                                repeatCount="indefinite"
                                path={`
                                    M ${width / 2} 0
                                    L ${width / 2} 20
                                `}
                            />

                        </circle>

                        {

                            Array.from({ length: childCount }).map((_, index) => {

                                const gap = width / childCount;

                                const x = gap * index + gap / 2;

                                return (
                                    <React.Fragment key={index}>
                                        <path
                                            d={`
                                                M ${width / 2} 20
                                                C ${width / 2} 40,
                                                ${x} 40,
                                                ${x} 65
                                            `}
                                            fill="none"
                                            stroke={linkColor}
                                            strokeWidth="3"
                                            markerEnd="url(#arrowHead)"
                                        />
                                        <circle
                                            r="4"
                                            fill="#1565C0"
                                        >

                                            <animateMotion
                                                dur="2.5s"
                                                begin={`${index * 0.4}s`}
                                                repeatCount="indefinite"
                                                path={`
                                                    M ${width / 2} 20
                                                    C ${width / 2} 40,
                                                    ${x} 40,
                                                    ${x} 65
                                                `}
                                            />

                                        </circle>
                                    </React.Fragment>

                                );

                            })

                        }

                    </svg>

                );

            }

            function renderChildDevices(parentId) {

                const children = getChildren(parentId)
                    .sort((a, b) => {

                        const priorityDiff =
                            getDevicePriority(a) - getDevicePriority(b);

                        if (priorityDiff !== 0)
                            return priorityDiff;

                        return (a.hostname || a.ip || "")
                            .localeCompare(b.hostname || b.ip || "");

                    });

                if (!children.length) return null;

                return (

                    <div
                        style={{
                            ...treeStyles.childrenContainer,

                            minWidth:
                                `${children.reduce(
                                    (total, child) => total + getBranchWidth(child.endpointId),
                                    0
                                ) + (children.length - 1) * NODE_GAP}px`
                        }}
                    >

                        <CurvedConnector
                            childCount={children.length}
                            width={
                                children.reduce(
                                    (total, child) =>
                                        total + getBranchWidth(child.endpointId),
                                    0
                                ) + (children.length - 1) * NODE_GAP
                            }
                            linkColor={
                                children.length
                                    ? getLinkColor(children[0])
                                    : "#556B2F"
                            }
                        />

                        <div style={treeStyles.childNodes}>

                            {children.map(device => {

                                const linkColor = getLinkColor(device);

                                return (

                                    <div
                                        key={device.endpointId}
                                        style={treeStyles.nodeWrapper}
                                    >

                                        <div
                                            style={{
                                                position: "relative",
                                                width: "4px",
                                                height: "35px",
                                                background:
                                                    device.connectionType === "Wireless"
                                                        ? "repeating-linear-gradient(to bottom,#1565C0 0px,#1565C0 6px,transparent 6px,transparent 12px)"
                                                        : linkColor,
                                                overflow: "visible"
                                            }}
                                        >

                                            <div
                                                style={{
                                                    position: "absolute",
                                                    width: "8px",
                                                    height: "8px",
                                                    borderRadius: "50%",
                                                    background: linkColor,
                                                    left: "-2px",
                                                    animation: "packetDown 1.3s linear infinite"
                                                }}
                                            />

                                        </div>

                                        <div
                                            style={{
                                                fontSize: "11px",
                                                fontWeight: "700",
                                                color: "#1565C0",
                                                marginBottom: "3px"
                                            }}
                                        >
                                            {getInterfaceName(device)}
                                        </div>

                                        <LinkLabel
                                            text={getLinkLabel(device)}
                                            wireless={device.connectionType === "Wireless"}
                                        />
                                        <div
                                            style={{
                                                fontSize: "10px",
                                                color: "#666",
                                                marginBottom: "5px",
                                                maxWidth: "180px",
                                                textAlign: "center",
                                                lineHeight: "14px"
                                            }}
                                        >
                                            {getConnectionDescription(device)}
                                        </div>

                                        <div
                                            style={{
                                                fontSize: "11px",
                                                fontWeight: "700",
                                                color: getLinkQuality(device).color,
                                                marginBottom: "6px"
                                            }}
                                        >
                                            {getLinkQuality(device).text}
                                        </div>
                                        <div
                                            style={{
                                                fontSize: "10px",
                                                color: "#2E7D32",
                                                fontWeight: "700",
                                                marginBottom: "8px"
                                            }}
                                        >
                                            🔗 {
                                                device.linkSpeed ||
                                                device.portSpeed ||
                                                device.interfaceSpeed ||
                                                "-"
                                            }
                                        </div>

                                        <NetworkNode
                                            icon={getDeviceIcon(device.deviceType)}
                                            title={device.hostname || device.ip}
                                            subtitle={device.ip}

                                            manufacturer={device.manufacturer}
                                            deviceType={device.deviceType}

                                            macAddress={device.mac}
                                            vendor={device.manufacturer}

                                            connectionType={device.connectionType}
                                            riskLevel={device.deviceRiskLevel}
                                            riskScore={device.deviceRiskScore}
                                            riskReason={
                                                device.deviceRiskReasons?.[0]?.text ||
                                                device.deviceRiskReasons?.[0] ||
                                                "-"
                                            }

                                            status={device.active}

                                            parentName={device.parentHostname}
                                            childCount={getChildren(device.endpointId).length}
                                            topologyLevel="Endpoint"
                                            linkConfidence={device.confidence || "100%"}

                                            highlight={
                                                isSelectedPath(device) ||
                                                isSearchMatch(device)
                                            }

                                            onContextMenu={(event) =>
                                                openContextMenu(event, device)
                                            }

                                            onClick={() => {
                                                setSelectedEndpoint(device.endpointId);
                                                onNodeClick(device);
                                            }}
                                        />

                                        {
                                            getChildren(device.endpointId).length > 0 &&

                                            <button
                                                style={treeStyles.collapseButton}
                                                onClick={(e) => {

                                                    e.stopPropagation();

                                                    toggleNode(device.endpointId);

                                                }}
                                            >

                                                {
                                                    collapsedNodes[device.endpointId]
                                                        ? `+${getChildren(device.endpointId).length}`
                                                        : "−"
                                                }

                                            </button>
                                        }

                                        {
                                            !collapsedNodes[device.endpointId] &&
                                            renderChildDevices(device.endpointId)
                                        }

                                    </div>
                                );

                            })}

                        </div>

                    </div>

                );

            }

            const gatewayChildren = getChildren(topology?.gateway?.endpointId);
            const stats = buildTopologyStatistics(topology);
            const [collapsedNodes, setCollapsedNodes] = React.useState({});
            const [selectedEndpoint, setSelectedEndpoint] = React.useState(null);
            const [topologySearch, setTopologySearch] = React.useState("");
            const selectedPath = getSelectedPath();

            const [contextMenu, setContextMenu] = React.useState({
                visible: false,
                x: 0,
                y: 0,
                device: null
            });

            React.useEffect(() => {

                function handleEsc(event) {
                    if (event.key === "Escape") {
                        closeContextMenu();
                    }
                }

                window.addEventListener("keydown", handleEsc);

                return () => {
                    window.removeEventListener("keydown", handleEsc);
                };

            }, []);

            const [selectedDevice, setSelectedDevice] = React.useState(null);

            function toggleNode(endpointId) {

                setCollapsedNodes(prev => ({
                    ...prev,
                    [endpointId]: !prev[endpointId]
                }));

            }

            function isSelectedPath(device) {

                if (!selectedEndpoint)
                    return false;

                let current = topology?.devices?.find(
                    d => d.endpointId === selectedEndpoint
                );

                while (current) {

                    if (current.endpointId === device.endpointId)
                        return true;

                    current = topology?.devices?.find(
                        d => d.endpointId === current.parentId
                    );

                }

                return device.endpointId === topology?.gateway?.endpointId;

            }

            function getSelectedPath() {

                if (!selectedEndpoint)
                    return [];

                const path = [];

                let current = topology?.devices?.find(
                    d => d.endpointId === selectedEndpoint
                );

                while (current) {

                    path.unshift(current);

                    current = topology?.devices?.find(
                        d => d.endpointId === current.parentId
                    );
                }

                if (topology?.gateway)
                    path.unshift(topology.gateway);

                return path;
            }
            
            function openContextMenu(event, device) {

                event.preventDefault();

                setContextMenu({
                    visible: true,
                    x: event.clientX,
                    y: event.clientY,
                    device
                });

            }
            
            function closeContextMenu() {

                setContextMenu({
                    visible: false,
                    x: 0,
                    y: 0,
                    device: null
                });

            }
            
            function copyToClipboard(text) {

                if (!text)
                    return;

                navigator.clipboard.writeText(text);

                closeContextMenu();

            }
            
            function openDeviceWeb(device) {

                if (!device)
                    return;

                if (!device.httpBannerDetected) {

                    alert(
                        "This device does not expose an HTTP/HTTPS Web Interface."
                    );

                    closeContextMenu();

                    return;
                }

                const scheme =
                    device.httpScheme || "HTTP";

                const url =
                    `${scheme.toLowerCase()}://${device.ip}`;

                window.open(
                    url,
                    "_blank",
                    "noopener,noreferrer"
                );

                closeContextMenu();
            }
            
            async function openTrafficAnalysis(device) {

                if (!device)
                    return;

                try {

                    setTrafficLoading(true);

                    const response =
                        await fetch(
                            `${API_BASE_URL}/traffic-analysis?ip=${encodeURIComponent(device.ip)}`
                        );

                    const data =
                        await response.json();

                    setTrafficAnalysis(data);

                    setShowTrafficAnalysis(true);

                }
                catch (error) {

                    alert(
                        "Unable to load Traffic Analysis."
                    );

                }
                finally {

                    setTrafficLoading(false);

                    closeContextMenu();

                }

            }
            
            async function openSecurityAnalysis(device) {

                if (!device)
                    return;

                try {

                    setSecurityLoading(true);

                    const response =
                        await fetch(
                            `${API_BASE_URL}/risk-analysis`
                        );

                    const data =
                        await response.json();

                    setSecurityAnalysis(data);

                    setShowSecurityAnalysis(true);

                }
                catch (error) {

                    alert(
                        "Unable to load Security Analysis."
                    );

                }
                finally {

                    setSecurityLoading(false);

                    closeContextMenu();

                }

            }
            
            function isSearchMatch(device) {

                if (!topologySearch.trim())
                    return false;

                const search = topologySearch.toLowerCase();

                return [

                    device.hostname,
                    device.ip,
                    device.mac,
                    device.endpointId,
                    device.manufacturer

                ]
                    .filter(Boolean)
                    .some(value =>
                        value.toLowerCase().includes(search)
                    );
            }
            
            function expandParents(endpointId) {

                const expanded = {};

                let current = topology?.devices?.find(
                    d => d.endpointId === endpointId
                );

                while (current && current.parentId) {

                    expanded[current.parentId] = false;

                    current = topology?.devices?.find(
                        d => d.endpointId === current.parentId
                    );
                }

                setCollapsedNodes(prev => ({
                    ...prev,
                    ...expanded
                }));
            }
            
            const NODE_WIDTH = 180;
            const NODE_GAP = 20;
            const treeStyles = {

                level: {
                    display: "flex",
                    justifyContent: "center",
                    alignItems: "flex-start",
                    flexWrap: "wrap",
                    gap: "60px",
                    width: "100%",
                    marginTop: "20px",
                    marginBottom: "20px"
                },

                nodeWrapper: {
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    minWidth: "180px",
                    flex: "0 0 auto"
                },

                childrenLevel: {
                    display: "flex",
                    justifyContent: "center",
                    alignItems: "flex-start",
                    flexWrap: "wrap",
                    gap: "20px",
                    marginTop: "20px"
                },

                verticalLine: {
                    width: "4px",
                    height: "35px",
                    background: "#556B2F"
                },

                wirelessVerticalLine: {
                    width: "4px",
                    height: "35px",
                    background:
                        "repeating-linear-gradient(to bottom,#1565C0 0px,#1565C0 6px,transparent 6px,transparent 12px)"
                },

                horizontalLine: {

                    alignSelf: "stretch",
                    height: "4px",
                    background: "#556B2F"
                },

                childrenContainer: {
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    width: "100%"
                },

                childNodes: {

                    display: "flex",
                    justifyContent: "center",
                    alignItems: "flex-start",
                    gap: `${NODE_GAP}px`,
                    marginTop: "0px",
                    flexWrap: "nowrap"
                },

                collapseButton: {

                    marginTop: "6px",
                    width: "26px",
                    height: "26px",
                    borderRadius: "50%",
                    border: "2px solid #556B2F",
                    background: "#FFFFFF",
                    color: "#556B2F",
                    cursor: "pointer",
                    fontWeight: "bold",
                    fontSize: "16px"

                }

            };

            return (

                <div
                    className="modal-overlay"
                    onClick={() => {

                        closeContextMenu();
                        onClose();

                    }}
                >

                    <div
                        className="modal-content"
                        style={{
                            width: "95vw",
                            maxWidth: "95vw",
                            maxHeight: "90vh",
                            overflow: "auto"
                        }}
                        onClick={(e) => {

                            e.stopPropagation();
                            closeContextMenu();

                        }}
                    >

                        <div style={styles.modalHeader}>

                            <div>
                                <h2>Network Topology</h2>

                                <div
                                    style={{
                                        display: "flex",
                                        alignItems: "center",
                                        gap: "8px",
                                        marginTop: "8px"
                                    }}
                                >

                                    <button
                                        className="btn"
                                        onClick={() => setZoom(z => Math.min(z + 0.1, 2))}
                                    >
                                        +
                                    </button>

                                    <button
                                        className="btn"
                                        onClick={() => setZoom(z => Math.max(z - 0.1, 0.5))}
                                    >
                                        −
                                    </button>

                                    <button
                                        className="btn"
                                        onClick={() => setZoom(1)}
                                    >
                                        Reset
                                    </button>

                                    <span
                                        style={{
                                            fontWeight: "700",
                                            color: "#556B2F"
                                        }}
                                    >
                                        {(zoom * 100).toFixed(0)}%
                                    </span>

                                </div>

                            </div>
                            <div
                                style={{
                                    marginTop: "12px",
                                    display: "flex",
                                    alignItems: "center",
                                    gap: "10px"
                                }}
                            >

                                <span
                                    style={{
                                        fontWeight: "700",
                                        color: "#556B2F",
                                        minWidth: "60px"
                                    }}
                                >
                                    Search
                                </span>

                                <input
                                    type="text"
                                    placeholder="Hostname / IP Address / MAC Address / Endpoint ID / Manufacturer"
                                    value={topologySearch}
                                    onChange={(e) => {

                                        const value = e.target.value;
                                        setTopologySearch(value);

                                        if (!value.trim())
                                            return;

                                        const match = topology?.devices?.find(device =>
                                            [
                                                device.hostname,
                                                device.ip,
                                                device.mac,
                                                device.endpointId,
                                                device.manufacturer
                                            ]
                                            .filter(Boolean)
